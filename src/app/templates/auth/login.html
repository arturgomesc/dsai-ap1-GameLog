{% extends "base.html" %}
{% block title %}Entrar — GameLog{% endblock %}
{% block content %}
<section class="panel" style="max-width:420px;margin:0 auto">
<h1>Entrar</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" required>
  <p><button>Entrar</button></p>
</form>
<p class="mut">Novo por aqui? <a href="/cadastro{{ '?next=' ~ request.args.get('next') | urlencode if request.args.get('next') }}">Criar conta</a></p>
</section>
{% endblock %}
